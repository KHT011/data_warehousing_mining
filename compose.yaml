x-pipeline-environment: &pipeline-environment
  TMDB_TOKEN: ${TMDB_TOKEN:-}
  SPARK_CORES: ${SPARK_CORES:-2}
  SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-8}
  SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-3g}
  DUCKDB_THREADS: ${DUCKDB_THREADS:-1}
  DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-4GB}

services:
  project:
    build: .
    image: movielens-project:local
    init: true
    restart: unless-stopped
    command: ["idle"]
    cpus: ${PROJECT_CPUS:-2.0}
    mem_limit: ${PROJECT_MEMORY_LIMIT:-6g}
    environment: *pipeline-environment
    ports:
      - "127.0.0.1:4213:4213"
    volumes:
      - ./data:/app/data
      - ./warehouse:/app/warehouse
      - ./reports:/app/reports
    shm_size: 1gb
  airflow:
    image: movielens-project:local
    # Explicitly enable orchestration; manual runs do not need this service.
    profiles: ["airflow"]
    init: true
    restart: unless-stopped
    command: ["airflow", "standalone"]
    stop_grace_period: 60s
    cpus: ${AIRFLOW_CPUS:-3.0}
    mem_limit: ${AIRFLOW_MEMORY_LIMIT:-7g}
    environment:
      <<: *pipeline-environment
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /app/reports/airflow/task-logs
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./warehouse:/app/warehouse
      - ./reports:/app/reports
      - airflow-state:/opt/airflow
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "/opt/airflow-venv/bin/python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8080/health',timeout=5)); assert d['metadatabase']['status']=='healthy' and d['scheduler']['status']=='healthy'"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
  mining:
    profiles: ["mining"]
    build:
      context: .
      dockerfile: Dockerfile.mining
    image: movielens-mining:local
    entrypoint: ["python", "-m", "mining.preliminary_bundle"]
    init: true
    cpus: 2.0
    mem_limit: 4g
    environment:
      PYTHONPATH: /app/src
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - ./warehouse:/app/warehouse:ro
      - ./src:/app/src:ro
      - ./notebooks:/app/notebooks
      - ./reports:/app/reports
      - ./data/processed:/app/data/processed
volumes:
  airflow-state:
